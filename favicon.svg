<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67F6FF" />
      <stop offset="100%" stop-color="#00C8FF" />
    </radialGradient>

    <linearGradient id="orbitGradient" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#A020F0" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background transparent -->

  <!-- Orbit 1 -->
  <ellipse
    cx="256"
    cy="256"
    rx="150"
    ry="60"
    stroke="url(#orbitGradient)"
    stroke-width="10"
    fill="none"
    transform="rotate(25 256 256)"
    opacity="0.95"
    filter="url(#glow)"
  />

  <!-- Orbit 2 -->
  <ellipse
    cx="256"
    cy="256"
    rx="150"
    ry="60"
    stroke="url(#orbitGradient)"
    stroke-width="10"
    fill="none"
    transform="rotate(-25 256 256)"
    opacity="0.95"
    filter="url(#glow)"
  />

  <!-- Orbit 3 -->
  <ellipse
    cx="256"
    cy="256"
    rx="70"
    ry="170"
    stroke="url(#orbitGradient)"
    stroke-width="8"
    fill="none"
    opacity="0.85"
    filter="url(#glow)"
  />

  <!-- Neural connection lines -->
  <line x1="180" y1="230" x2="256" y2="256"
        stroke="#7DF9FF"
        stroke-width="6"
        opacity="0.85" />

  <line x1="332" y1="230" x2="256" y2="256"
        stroke="#C86BFF"
        stroke-width="6"
        opacity="0.85" />

  <line x1="210" y1="320" x2="256" y2="256"
        stroke="#7DF9FF"
        stroke-width="5"
        opacity="0.75" />

  <!-- Central neural node -->
  <circle
    cx="256"
    cy="256"
    r="34"
    fill="url(#coreGlow)"
    filter="url(#glow)"
  />

  <!-- Small neural nodes -->
  <circle cx="180" cy="230" r="12" fill="#67F6FF" filter="url(#glow)" />
  <circle cx="332" cy="230" r="12" fill="#C86BFF" filter="url(#glow)" />
  <circle cx="210" cy="320" r="10" fill="#67F6FF" filter="url(#glow)" />
</svg>
